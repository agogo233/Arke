# Win x64 portable build. Builds the single portable exe from main (or by hand) and
# uploads one flat zip as an artifact. Portable is Arke's headline distribution (README
# "Install": a single exe, no runtime), so this build skips the Inno Setup installer.
name: portable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: portable · x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: portable-x64
          workspaces: ". -> target/dist"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about

      - name: build portable (x64)
        shell: bash
        run: |
          # nightly channel: version = <next>-nightly.YYYYMMDD. No Inno Setup on the runner and
          # ARKE_REQUIRE_SETUP unset, so xtask skips the installer and ships the portable exe only.
          cargo xtask build nightly --arch x64
          ls -l dist

      - name: check the package is complete
        shell: pwsh
        run: |
          $all   = @(Get-ChildItem -Path dist -File)
          $names = $all | Select-Object -ExpandProperty Name | Sort-Object
          Write-Host "dist contents ($($all.Count) files):"
          $names | ForEach-Object { Write-Host "  $_" }
          $exe   = @($all | Where-Object { $_.Name -match '^arke-.*\.exe$' -and $_.Name -notmatch '-setup' })
          $sha   = @($all | Where-Object { $_.Name -match '\.exe\.sha256$' -and $_.Name -notmatch '-setup' })
          $notes = @($all | Where-Object { $_.Name -match '^arke-.*\.md$' })
          $lic   = $all | Where-Object { $_.Name -eq 'THIRD_PARTY_LICENSES.md' }
          $setup = @($all | Where-Object { $_.Name -match '-setup\.exe$' })
          $miss = @()
          if ($exe.Count    -ne 1) { $miss += "exactly one portable exe (found $($exe.Count))" }
          if ($sha.Count    -ne 1) { $miss += "exe .sha256 (found $($sha.Count))" }
          if ($notes.Count  -ne 1) { $miss += "arke-<version>.md notes (found $($notes.Count))" }
          if (-not $lic)           { $miss += 'THIRD_PARTY_LICENSES.md' }
          if ($setup.Count -gt 0)   { $miss += "installer should not be built (found: $($setup -join ', '))" }
          if ($miss) { throw "dist incomplete: $($miss -join '; ')" }
          Write-Host "OK: portable package complete ($($all.Count) files, no installer)"

      - name: zip the package (flat, no nesting) and verify entries
        shell: pwsh
        run: |
          $zipPath = Join-Path $PWD 'arke-portable-x64.zip'
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          $distFiles = @(Get-ChildItem -Path dist -File)
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::Open($zipPath, [System.IO.Compression.ZipArchiveMode]::Create)
          try {
            foreach ($f in $distFiles) {
              $entry  = $zip.CreateEntry($f.Name, [System.IO.Compression.CompressionLevel]::Optimal)
              $stream = $entry.Open()
              try { $f.OpenRead().CopyTo($stream) } finally { $stream.Dispose() }
            }
          } finally { $zip.Dispose() }
          $zip2 = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $entries = @($zip2.Entries | ForEach-Object { $_.FullName })
            Write-Host "zip entries ($($entries.Count)):"
            $entries | ForEach-Object { Write-Host "  $_" }
            if ($entries.Count -ne $distFiles.Count) {
              throw "zip has $($entries.Count) entries but dist has $($distFiles.Count) files"
            }
            foreach ($f in $distFiles) {
              if ($entries -notcontains $f.Name) { throw "zip missing entry: $($f.Name)" }
            }
          } finally { $zip2.Dispose() }
          Write-Host "OK: zip matches dist exactly ($($entries.Count) flat entries, no nesting)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arke-portable-x64
          path: arke-portable-x64.zip
          if-no-files-found: error
          retention-days: 7
