# Win x64 portable build. Builds the single portable exe from main (or by hand) and uploads
# the four dist files as one artifact (GitHub zips them flat: one unzip gives the bundle, no
# nested zip). Portable is Arke's headline distribution (README "Install": a single exe, no
# runtime), so this build skips the Inno Setup installer.
name: portable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: portable · x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: portable-x64
          workspaces: ". -> target/dist"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about

      - name: remove preinstalled Inno Setup (skip installer, portable-only)
        shell: pwsh
        run: |
          # windows-latest ships Inno Setup 6.7.0-6.7.3; upstream 0.9.2's arke.iss now requires
          # 6.7.4+, so xtask would try (and fail) to build the installer. Portable-only wants the
          # installer skipped, so delete Inno Setup from the paths iscc() searches -> iscc() None.
          # Resolve env vars via [Environment]::GetEnvironmentVariable: the ProgramFiles(x86) name
          # has a space before "(x86)", which "$env:ProgramFiles(x86)" interpolation would drop
          # (it parses as $env:ProgramFiles + literal "(x86)").
          $bases = @(
            [Environment]::GetEnvironmentVariable('ProgramFiles(x86)'),
            [Environment]::GetEnvironmentVariable('ProgramFiles'),
            [Environment]::GetEnvironmentVariable('LOCALAPPDATA')
          )
          $dirs = @()
          foreach ($b in $bases) {
            if (-not $b) { continue }
            if ($b -like '*Local') { $b = Join-Path $b 'Programs' }
            $dir = Join-Path $b 'Inno Setup 6'
            if (Test-Path $dir) { $dirs += $dir }
          }
          foreach ($d in $dirs) {
            Write-Host "removing $d"
            Remove-Item $d -Recurse -Force -ErrorAction SilentlyContinue
          }
          $left = @()
          foreach ($b in $bases) {
            if (-not $b) { continue }
            if ($b -like '*Local') { $b = Join-Path $b 'Programs' }
            $exe = Join-Path $b 'Inno Setup 6\ISCC.exe'
            if (Test-Path $exe) { $left += $exe }
          }
          if ($left) { throw "Inno Setup still present: $($left -join ', ')" }
          Write-Host "OK: Inno Setup removed; xtask will skip the installer (portable-only)"

      - name: build portable (x64)
        shell: bash
        run: |
          # nightly channel: version = <next>-nightly.YYYYMMDD. ARKE_REQUIRE_SETUP unset and Inno
          # Setup removed above, so iscc() returns None and xtask skips the installer: portable exe only.
          cargo xtask build nightly --arch x64
          ls -l dist

      - name: check the package is complete
        shell: pwsh
        run: |
          $all   = @(Get-ChildItem -Path dist -File)
          $names = $all | Select-Object -ExpandProperty Name | Sort-Object
          Write-Host "dist contents ($($all.Count) files):"
          $names | ForEach-Object { Write-Host "  $_" }
          $exe   = @($all | Where-Object { $_.Name -match '^arke-.*\.exe$' -and $_.Name -notmatch '-setup' })
          $sha   = @($all | Where-Object { $_.Name -match '\.exe\.sha256$' -and $_.Name -notmatch '-setup' })
          $notes = @($all | Where-Object { $_.Name -match '^arke-.*\.md$' })
          $lic   = $all | Where-Object { $_.Name -eq 'THIRD_PARTY_LICENSES.md' }
          $setup = @($all | Where-Object { $_.Name -match '-setup\.exe$' })
          $miss = @()
          if ($exe.Count    -ne 1) { $miss += "exactly one portable exe (found $($exe.Count))" }
          if ($sha.Count    -ne 1) { $miss += "exe .sha256 (found $($sha.Count))" }
          if ($notes.Count  -ne 1) { $miss += "arke-<version>.md notes (found $($notes.Count))" }
          if (-not $lic)           { $miss += 'THIRD_PARTY_LICENSES.md' }
          if ($setup.Count -gt 0)   { $miss += "installer should not be built (found: $($setup -join ', '))" }
          if ($miss) { throw "dist incomplete: $($miss -join '; ')" }
          Write-Host "OK: portable package complete ($($all.Count) files, no installer)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arke-portable-x64
          path: dist
          if-no-files-found: error
          retention-days: 7
